
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">

<title>Easy Trick - PDF Link Generator</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #000;
    --panel-bg: rgba(5,5,5,.85);
    --neon-blue: #00f3ff;
    --neon-red: #ff003c;
    --text-main: #e0e0e0;
    --text-muted: #888;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background-color: var(--bg);
    background-image:
        radial-gradient(circle at 50% 0%,rgba(0,243,255,.1),transparent 50%),
        radial-gradient(circle at 100% 100%,rgba(255,0,60,.05),transparent 50%),
        linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
    background-size: 100% 100%,100% 100%,30px 30px,30px 30px;
    color: var(--text-main);
    font-family: 'Share Tech Mono',monospace;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    background: var(--panel-bg);
    border: 1px solid rgba(0,243,255,.3);
    border-radius: 8px;
    width: 100%;
    max-width: 700px;
    padding: 40px 30px;
    box-shadow: 0 0 20px rgba(0,243,255,.1),inset 0 0 20px rgba(0,243,255,.05);
    position: relative;
    backdrop-filter: blur(10px);
}

.container::before,
.container::after {
    content: '';
    position: absolute;
    width: 20px;
    height: 20px;
    pointer-events: none;
}

.container::before {
    top: -1px;
    left: -1px;
    border-top: 2px solid var(--neon-blue);
    border-left: 2px solid var(--neon-blue);
}

.container::after {
    bottom: -1px;
    right: -1px;
    border-bottom: 2px solid var(--neon-red);
    border-right: 2px solid var(--neon-red);
}

.header {
    text-align: center;
    margin-bottom: 35px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.logo-placeholder {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 2px dashed var(--neon-blue);
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 15px;
    box-shadow: 0 0 15px rgba(0,243,255,.2);
    overflow: hidden;
    background: #000;
}

.logo-placeholder img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.header h1 {
    font-family: 'Orbitron',sans-serif;
    font-size: 32px;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 0 10px var(--neon-blue),0 0 20px var(--neon-blue);
    letter-spacing: 2px;
    margin-bottom: 5px;
    text-transform: uppercase;
}

.header p {
    color: var(--neon-blue);
    font-size: 14px;
    letter-spacing: 1px;
}

.input-group {
    position: relative;
    margin-bottom: 25px;
}

.input-group svg {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    width: 21px;
    height: 21px;
    fill: none;
    stroke: var(--neon-blue);
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 5px var(--neon-blue));
}

.input-group input {
    width: 100%;
    background: rgba(0,0,0,.6);
    border: 1px solid #333;
    border-radius: 4px;
    padding: 16px 16px 16px 50px;
    color: var(--neon-blue);
    font-family: 'Share Tech Mono',monospace;
    font-size: 16px;
    outline: none;
    transition: all .3s;
}

.input-group input:focus {
    border-color: var(--neon-blue);
    box-shadow: 0 0 15px rgba(0,243,255,.3);
    background: rgba(0,243,255,.05);
}

.input-group input::placeholder {
    color: var(--text-muted);
}

.btn {
    width: 100%;
    padding: 16px;
    border: 1px solid var(--neon-blue);
    border-radius: 4px;
    font-size: 18px;
    font-family: 'Orbitron',sans-serif;
    font-weight: 700;
    cursor: pointer;
    transition: all .3s;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    background: transparent;
    color: var(--neon-blue);
    box-shadow: 0 0 10px rgba(0,243,255,.2),inset 0 0 10px rgba(0,243,255,.1);
}

.btn-primary:hover {
    background: var(--neon-blue);
    color: #000;
    box-shadow: 0 0 20px rgba(0,243,255,.6);
}

.btn:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.result-box {
    margin-top: 25px;
    display: none;
    animation: fadeIn .4s ease;
    text-align: center;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

.result-title {
    color: var(--neon-blue);
    font-size: 16px;
    margin-bottom: 18px;
    letter-spacing: 1px;
}

.pdf-preview {
    background: #fff;
    width: 180px;
    height: 230px;
    margin: 0 auto 22px;
    border-radius: 3px;
    box-shadow: 0 0 20px rgba(0,243,255,.25);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

.pdf-preview::before,
.pdf-preview::after {
    content: '';
    position: absolute;
    width: 20px;
    height: 20px;
    pointer-events: none;
}

.pdf-preview::before {
    top: 0;
    left: 0;
    border-top: 3px solid var(--neon-blue);
    border-left: 3px solid var(--neon-blue);
}

.pdf-preview::after {
    bottom: 0;
    right: 0;
    border-bottom: 3px solid var(--neon-red);
    border-right: 3px solid var(--neon-red);
}

.pdf-icon {
    color: #ddd;
    font-family: Arial;
    font-size: 60px;
    font-weight: bold;
}

.btn-download {
    border-color: var(--neon-red);
    color: var(--neon-red);
    box-shadow: 0 0 10px rgba(255,0,60,.2),inset 0 0 10px rgba(255,0,60,.1);
}

.btn-download:hover {
    background: var(--neon-red);
    color: #000;
    box-shadow: 0 0 20px rgba(255,0,60,.6);
}

.status {
    color: var(--neon-blue);
    font-size: 13px;
    margin-top: 15px;
    display: none;
    line-height: 1.6;
}

@media(max-width:600px) {
    .container { padding: 30px 20px; }
    .header h1 { font-size: 28px; }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="logo-placeholder">
            <img
                src="https://i.ibb.co/vvg2sGhf/1794889466796.jpg"
                alt="Easy Trick Logo"
                onerror="this.style.display='none';">
        </div>

        <h1>Easy Trick</h1>
        <p>PDF Link Generator</p>
    </div>

    <div class="input-group">
        <input
            type="url"
            id="url"
            placeholder="Enter Your URL"
            autocomplete="url">

        <svg viewBox="0 0 24 24">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
        </svg>
    </div>

    <button class="btn btn-primary" id="generateBtn" onclick="generatePDF()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path d="M6 2h9l5 5v15H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm8 1v5h5M8 14h8v2H8zm0 4h8v2H8z"/>
        </svg>
        Generate PDF
    </button>

    <div class="result-box" id="resultBox">

        <p class="result-title">YOUR PDF IS READY</p>

        <div class="pdf-preview">
            <span class="pdf-icon">PDF</span>
        </div>

        <button class="btn btn-download" onclick="downloadPDF()">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 3v12m-5-5 5 5 5-5M4 19v2h16v-2"/>
            </svg>
            Download PDF
        </button>

        <p class="status" id="status"></p>

    </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>

let generatedPDF = null;
let generatedURL = "";

function generatePDF() {

    const input = document.getElementById("url");
    const url = input.value.trim();

    const status = document.getElementById("status");
    const resultBox = document.getElementById("resultBox");
    const generateBtn = document.getElementById("generateBtn");

    if (!url) {
        alert("Please enter a URL first!");
        return;
    }

    let parsed;

    try {
        parsed = new URL(url);

        if (!["http:", "https:"].includes(parsed.protocol)) {
            throw new Error("Invalid protocol");
        }

    } catch (error) {
        alert("Please enter a valid URL!");
        return;
    }

    if (!window.jspdf || !window.jspdf.jsPDF) {
        alert("PDF library failed to load. Please refresh the page.");
        return;
    }

    try {

        generateBtn.disabled = true;
        generateBtn.textContent = "GENERATING...";

        const { jsPDF } = window.jspdf;

        // Create a blank A4 PDF
        const pdf = new jsPDF({
            orientation: "portrait",
            unit: "pt",
            format: "a4",
            compress: true
        });

        const pageWidth = pdf.internal.pageSize.getWidth();
        const pageHeight = pdf.internal.pageSize.getHeight();

        // Add one transparent clickable link covering the entire page.
        // The page itself remains completely white and empty.
        pdf.link(0, 0, pageWidth, pageHeight, {
            url: parsed.href
        });

        // Generate PDF as a Blob
        generatedPDF = pdf.output("blob");
        generatedURL = URL.createObjectURL(generatedPDF);

        resultBox.style.display = "block";
        status.style.display = "block";
        status.textContent = "PDF generated successfully! Your link is embedded.";

        setTimeout(() => {
            resultBox.scrollIntoView({
                behavior: "smooth",
                block: "nearest"
            });
        }, 100);

    } catch (error) {

        console.error(error);
        alert("Unable to generate PDF. Please try again.");

    } finally {

        generateBtn.disabled = false;
        generateBtn.innerHTML = `
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                <path d="M6 2h9l5 5v15H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm8 1v5h5M8 14h8v2H8zm0 4h8v2H8z"/>
            </svg>
            Generate PDF
        `;

    }
}


function downloadPDF() {

    if (!generatedPDF) {
        alert("Please generate a PDF first!");
        return;
    }

    const link = document.createElement("a");

    link.href = generatedURL;
    link.download = "Easy-Trick-Link.pdf";

    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

    const status = document.getElementById("status");

    status.style.display = "block";
    status.textContent = "Your PDF download has started!";

}


document.getElementById("url").addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        generatePDF();
    }
});


if (window.Telegram && window.Telegram.WebApp) {
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
}

</script>

</body>
</html>
